<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Pick — pick tonight's movie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<div class="room-bar" id="room-bar" hidden>
  <span class="room-bar-label">Room</span>
  <span class="room-bar-code" id="room-bar-code"></span>
  <span class="room-bar-hint">join anytime</span>
</div>

<main id="app">

  <!-- LANDING -->
  <section id="view-landing" class="view">
    <div class="stage">
      <h1 class="marquee">Reel Pick</h1>
      <p class="tagline">Everyone piles in. One movie wins.</p>

      <div class="card auth-card">
        <label class="field">
          <span>Your name</span>
          <input type="text" id="input-name" placeholder="e.g. Cosmin" maxlength="20" autocomplete="off">
        </label>

        <div class="split">
          <div class="split-col">
            <button class="btn btn-primary" id="btn-create-room">Start a room</button>
          </div>
          <div class="split-col">
            <label class="field">
              <span>Room code</span>
              <input type="text" id="input-code" placeholder="ABCD" maxlength="6" autocomplete="off">
            </label>
            <button class="btn btn-secondary" id="btn-join-room">Join room</button>
          </div>
        </div>
        <p class="error" id="landing-error"></p>
      </div>
    </div>
  </section>

  <!-- GENRES (room starter only) -->
  <section id="view-genres" class="view hidden">
    <div class="stage">
      <h2 class="stage-title">Pick your genres</h2>
      <p class="eyebrow-hint">Choose 2 or 3 — tonight's picks come from these.</p>
      <div class="chip-grid" id="genre-grid"></div>
      <p class="hint" id="genre-count"></p>
      <button class="btn btn-primary btn-large" id="btn-start-room" disabled>Start the room</button>
      <button class="btn btn-ghost" id="btn-genres-back">Back</button>
      <p class="error" id="genre-error"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="view-lobby" class="view hidden">
    <div class="stage">
      <div class="ticket">
        <span class="ticket-label">Room code</span>
        <span class="ticket-code" id="lobby-code">----</span>
        <span class="ticket-genres" id="lobby-genres"></span>
      </div>

      <h2 class="section-title">Who's in</h2>
      <ul class="member-list" id="member-list"></ul>

      <button class="btn btn-primary btn-large" id="btn-all-in">I am in</button>
      <p class="hint" id="lobby-hint">Waiting for everyone to be in…</p>
      <p class="error" id="lobby-error"></p>
    </div>
  </section>

  <!-- PICKING (loader) -->
  <section id="view-picking" class="view hidden">
    <div class="stage">
      <div class="spinner" role="status" aria-live="polite" aria-label="Picking a movie"></div>
      <p class="picking-text" id="picking-text">Picking a movie…</p>
      <p class="error" id="picking-error"></p>
    </div>
  </section>

  <!-- REVEAL -->
  <section id="view-reveal" class="view hidden">
    <div class="stage">
      <p class="eyebrow-hint" id="reveal-status">Picking tonight's film…</p>
      <div class="movie-card" id="movie-card">
        <div class="poster-wrap">
          <img id="movie-poster" class="poster" alt="">
        </div>
        <div class="movie-info">
          <h2 id="movie-title" class="movie-title"></h2>
          <p id="movie-meta" class="movie-meta"></p>
          <p id="movie-overview" class="movie-overview"></p>
        </div>
      </div>

      <div class="vote-row" id="vote-row">
        <button class="btn btn-vote btn-seen" id="btn-seen-it">Neah</button>
        <button class="btn btn-vote btn-not-seen" id="btn-not-seen-it">Wanna see it</button>
      </div>
      <p class="hint" id="reveal-hint"></p>
    </div>
  </section>

  <!-- WINNER -->
  <section id="view-winner" class="view hidden">
    <div class="stage">
      <p class="eyebrow-hint">Tonight's pick</p>
      <div class="movie-card winner-card" id="winner-card">
        <div class="poster-wrap">
          <span class="winner-badge">★ Winner</span>
          <img id="winner-poster" class="poster" alt="">
        </div>
        <div class="movie-info">
          <h2 id="winner-title" class="movie-title"></h2>
          <p id="winner-meta" class="movie-meta"></p>
          <p id="winner-overview" class="movie-overview"></p>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-play-again">Pick again</button>
    </div>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
